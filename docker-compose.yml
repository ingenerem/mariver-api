version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: mariver-postgres
    environment:
      POSTGRES_DB: mariver_db
      POSTGRES_USER: mariver_user
      POSTGRES_PASSWORD: mariverly-2023
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: